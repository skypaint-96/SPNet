schemaVersion: spnet.workflow/v1
name: YamlLookupFixedSmoke
start:
  manual: true
target:
  type: Site
variables:
- name: currentWebUrl
  type: String
- name: currentItemUrl
  type: String
- name: currentListId
  type: Guid
- name: currentItemGuid
  type: Guid
stages:
- name: Lookup Smoke
  actions:
  - type: setStatus
    status: Lookup Smoke
  - type: assign
    to: currentWebUrl
    value:
      type: lookupWorkflowContext
      propertyName: CurrentWebUrl
  - type: assign
    to: currentItemUrl
    value:
      type: lookupContextProperty
      propertyName: CurrentItemUrl
  - type: assign
    to: currentListId
    value:
      type: getCurrentListId
  - type: assign
    to: currentItemGuid
    value:
      type: getCurrentItemGuid
  - type: writeHistory
    message:
      variable: currentWebUrl
  - type: writeHistory
    message:
      variable: currentItemUrl
  - type: setStatus
    status: Lookup Smoke Complete
