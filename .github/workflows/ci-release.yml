name: CI and Release

on:
  push:
    branches:
      - development
      - production
  pull_request:
    branches:
      - development
      - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-source:
    name: Validate production PR source
    runs-on: windows-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    steps:
      - name: Require development source branch
        shell: pwsh
        run: |
          if ('${{ github.head_ref }}' -ne 'development') {
            Write-Error "Pull requests targeting production must come from development. Actual source: '${{ github.head_ref }}'."
          }

  validate:
    name: Validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Nerdbank.GitVersioning tool
        run: dotnet tool install --global nbgv

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $json = nbgv get-version --format json | ConvertFrom-Json
          $version = $json.NuGetPackageVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $json.SemVer2
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Nerdbank.GitVersioning did not produce a package version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=spnet-workflow-$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Show computed version
        run: nbgv get-version

      - name: Restore
        run: dotnet restore .\SPNet.slnx

      - name: Build Release
        run: dotnet build .\SPNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\tests\SPNet.Workflow.WfSerializer.Tests\SPNet.Workflow.WfSerializer.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=SPNet.Workflow.WfSerializer.Tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Nerdbank.GitVersioning tool
        run: dotnet tool install --global nbgv

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $json = nbgv get-version --format json | ConvertFrom-Json
          $version = $json.NuGetPackageVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $json.SemVer2
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Nerdbank.GitVersioning did not produce a package version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=spnet-workflow-$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Show computed version
        run: nbgv get-version

      - name: Build package assets
        shell: pwsh
        run: .\scripts\Package-SPNetWorkflow.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}' -OutputDirectory .\artifacts\release -IncludeNuGetPackages

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            artifacts/release/*.zip
            artifacts/release/nuget/*.nupkg
            artifacts/release/nuget/*.snupkg
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: spnet-workflow-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          name: SPNet Workflow ${{ needs.package.outputs.version }}
          generate_release_notes: true
          files: release-assets/**/*
